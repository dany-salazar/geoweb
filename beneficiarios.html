<html>
<head>
    <meta charset='utf-8' />
    <title>Recintos electorales</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />

    <!-- Mapbox -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.11.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.11.0/mapbox-gl.css' rel='stylesheet' />

    <!-- Geocoder -->
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">

    <!-- Turf + Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Estilos base -->
    <link href='css/estilobase.css' rel='stylesheet' />

    <!-- Scripts -->
    <script src='js/utils.js'></script>
    <script src='js/farmacias.js'></script>

    <style>
        /* Panel del gráfico flotante */
        #panel-grafico {
         position: absolute;
    bottom: 10px;   /* ahora está a 10px del fondo */
    right: 10px;    /* mantiene distancia desde la derecha */
    width: 380px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 1;
        }

        #graficoParroquias {
            width: 100%;
            height: 250px;
        }

        #map {
            position: absolute;
            top: 0; bottom: 0; width: 100%;
        }
    </style>

    <script>
        var map;
        var farmaciasGeoJSON;

        function init() {
            mapboxgl.accessToken = 'pk.eyJ1IjoiZGFueXNhbGF6YXIxOTg1IiwiYSI6ImNsY3oyM3Z0eTE3aGkzd21vY2cxZnhteW4ifQ.47rPRO3Tktn0HVtB4h_Htg';
            
            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/satellite-streets-v11',
                center: [-78.40751, -1.17555],
                zoom: 7.90,
                attributionControl: false,
                hash: true,
                pitch: 7.50,
                bearing: -8.80
            });

            map.addControl(new mapboxgl.AttributionControl({ compact: true }));
            map.addControl(new mapboxgl.NavigationControl());
            map.addControl(new MapboxGeocoder({
                accessToken: mapboxgl.accessToken,
                mapboxgl: mapboxgl,
                localGeocoder: buscarFarmacias,
                collapsed: true
            }));

            map.on("load", function () {
                addGuaranda();
                addCentros();

                enviarPeticion("datos/beneficiarios2.geojson").then(function (datos) {
                    farmaciasGeoJSON = datos;
                    addBeneficiarios();
                    addPopupBeneficiario("farmacias");
                });
            });
        } // fin init
    </script>
</head>

<body onload="init()">
    <div id="map"></div>

    <!-- Panel del gráfico -->
    <div id="panel-grafico">
        <canvas id="graficoParroquias"></canvas>
    </div>
</body>
</html>
